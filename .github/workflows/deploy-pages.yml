# نشر تلقائي على GitHub Pages
# يعمل عند كل push إلى الفرع الافتراضي: يبني موقع الـ frontend وينشره.
# التفعيل: Settings → Pages → Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/vibrant-mendel-fffvom # الفرع الافتراضي الحالي
      - main # في حال تغيير الفرع الافتراضي مستقبلاً
  workflow_dispatch: # يسمح بتشغيل النشر يدوياً من تبويب Actions

permissions:
  contents: read
  pages: write
  id-token: write

# لا تشغّل أكثر من عملية نشر بنفس الوقت
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v4
        with:
          enablement: true # يفعّل GitHub Pages تلقائياً إن لم يكن مفعّلاً

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
