<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="220" height="240" role="img" aria-label="RAMADAN">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D03F"/>
      <stop offset="0.5" stop-color="#D9A521"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8DCE0"/>
      <stop offset="0.5" stop-color="#9CA3AF"/>
      <stop offset="1" stop-color="#5B6168"/>
    </linearGradient>
  </defs>

  <!-- top wireframe tower -->
  <g fill="none" stroke="url(#silver)" stroke-width="3" stroke-linejoin="round">
    <path d="M78 70 L110 18 L142 70 L142 116 L78 116 Z"/>
    <path d="M78 92 L142 92 M110 18 L110 116 M94 86 L94 116 M126 86 L126 116"/>
  </g>

  <!-- orbital ring -->
  <ellipse cx="110" cy="112" rx="86" ry="26" fill="none" stroke="url(#silver)" stroke-width="7"/>

  <!-- gold building -->
  <g fill="url(#gold)">
    <rect x="92" y="96" width="36" height="104" rx="2"/>
    <rect x="58" y="150" width="104" height="6" rx="2"/>
  </g>
  <!-- windows -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="74" y="112" width="9" height="13"/><rect x="74" y="132" width="9" height="13"/>
    <rect x="100" y="110" width="9" height="13"/><rect x="113" y="110" width="9" height="13"/>
    <rect x="100" y="130" width="9" height="13"/><rect x="113" y="130" width="9" height="13"/>
  </g>

  <!-- wordmark -->
  <text x="110" y="228" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="url(#silver)">RAMADAN</text>
</svg>
