<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" role="img" aria-label="RAMADAN">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE08A"/>
      <stop offset="0.45" stop-color="#E6B12E"/>
      <stop offset="1" stop-color="#A9760A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDEFF1"/>
      <stop offset="0.5" stop-color="#A9AEB5"/>
      <stop offset="1" stop-color="#565C64"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C727A"/>
      <stop offset="0.5" stop-color="#D7DBDF"/>
      <stop offset="1" stop-color="#E8B53A"/>
    </linearGradient>
  </defs>

  <!-- Top wireframe tower -->
  <g fill="none" stroke="url(#silver)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M86 80 V42 L130 14 L174 42 V80"/>
    <path d="M86 80 H174"/>
    <path d="M86 60 H174"/>
    <path d="M108 28 V80 M130 14 V80 M152 28 V80"/>
  </g>

  <!-- Orbital ring with swoosh tail -->
  <path d="M70 120 C70 100 190 100 196 124 C200 140 150 152 120 150"
        fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>
  <path d="M196 124 C210 112 214 128 196 136" fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>

  <!-- Gold building -->
  <g fill="url(#gold)">
    <rect x="112" y="96" width="40" height="124" rx="2"/>
    <rect x="64" y="214" width="132" height="8" rx="3"/>
  </g>

  <!-- Side block windows (gold frame) -->
  <g fill="none" stroke="url(#gold)" stroke-width="6">
    <rect x="84" y="120" width="20" height="22"/>
    <rect x="84" y="152" width="20" height="22"/>
  </g>

  <!-- Tower windows (white) -->
  <g fill="#ffffff">
    <rect x="120" y="116" width="11" height="16"/>
    <rect x="135" y="116" width="11" height="16"/>
    <rect x="120" y="140" width="11" height="16"/>
    <rect x="135" y="140" width="11" height="16"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="266" text-anchor="middle" font-family="Poppins, Arial, sans-serif"
        font-weight="800" font-size="40" letter-spacing="3" fill="url(#silver)">RAMADAN</text>
</svg>
